# ============================================
# docker-compose.yml - Marine Equipment QR System
# Production configuration for Synology DS223
# ============================================
version: '3.8'

services:
  # ----------------------------------------
  # Backend API Service
  # ----------------------------------------
  backend:
    image: marine-equipment-backend:${ARCH:-arm64}
    container_name: marine-equipment-backend
    restart: unless-stopped
    environment:
      # Application settings
      - APP_NAME=${APP_NAME:-Marine Equipment QR System}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-false}
      # Security settings
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - TEMP_TOKEN_EXPIRE_MINUTES=${TEMP_TOKEN_EXPIRE_MINUTES:-3}
      # Database settings
      - DATABASE_URL=sqlite+aiosqlite:///./data/marine_equipment.db
      # CORS settings
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:8080"]}
      # QR Code settings
      - QR_CODE_DOMAIN=${QR_CODE_DOMAIN:-localhost:8080}
      - QR_CODE_PROTOCOL=${QR_CODE_PROTOCOL:-http}
    volumes:
      # Persistent data volumes
      - marine_data:/app/data
      - marine_uploads:/app/uploads
    networks:
      - marine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits (suitable for DS223)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # Frontend Service (Nginx)
  # ----------------------------------------
  frontend:
    image: marine-equipment-frontend:${ARCH:-arm64}
    container_name: marine-equipment-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      # SSL certificates (for HTTPS)
      - ${SSL_CERT_PATH:-./ssl}:/etc/nginx/ssl:ro
    networks:
      - marine-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------
# Network Definition
# ----------------------------------------
networks:
  marine-network:
    driver: bridge

# ----------------------------------------
# Persistent Volumes
# ----------------------------------------
volumes:
  marine_data:
    driver: local
  marine_uploads:
    driver: local
