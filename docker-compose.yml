# ============================================
# docker-compose.yml - 海洋設備 QR 管理系統
# 適用於 Synology DS223 Container Manager
# ============================================
version: '3.8'

services:
  # ----------------------------------------
  # 後端 API 服務
  # ----------------------------------------
  backend:
    image: marine-equipment-backend:arm64
    container_name: marine-equipment-backend
    restart: unless-stopped
    environment:
      # 應用程式設定
      - APP_NAME=${APP_NAME:-Marine Equipment QR System}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DEBUG=${DEBUG:-false}
      # 安全性設定
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - TEMP_TOKEN_EXPIRE_MINUTES=${TEMP_TOKEN_EXPIRE_MINUTES:-3}
      # 資料庫設定
      - DATABASE_URL=sqlite+aiosqlite:///./data/marine_equipment.db
      # CORS 設定
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["http://localhost:8080"]}
      # QR Code 設定
      - QR_CODE_DOMAIN=${QR_CODE_DOMAIN:-localhost:8080}
      - QR_CODE_PROTOCOL=${QR_CODE_PROTOCOL:-http}
    volumes:
      # 持久化資料卷
      - marine_data:/app/data
      - marine_uploads:/app/uploads
    networks:
      - marine-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # 資源限制（適合 DS223 入門級 NAS）
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------
  # 前端服務 (Nginx)
  # ----------------------------------------
  frontend:
    image: marine-equipment-frontend:arm64
    container_name: marine-equipment-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - marine-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------
# 網路定義
# ----------------------------------------
networks:
  marine-network:
    driver: bridge

# ----------------------------------------
# 持久化資料卷
# ----------------------------------------
volumes:
  marine_data:
    driver: local
  marine_uploads:
    driver: local
